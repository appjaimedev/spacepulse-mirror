name: LL2 Mirror Sync

# Cadencia conservadora dentro del tramo anónimo (15 req/h por IP). El pasado es
# inmutable: una vez espejado, NO se vuelve a pedir (el backfill solo construye
# décadas que falten y es no-op al acabar; el refresco diario solo toca la década
# actual). Así nos centramos en el presente sin abusar de la API.
#   - cada 30 min   → --upcoming  (solo upcoming.json, 1 req) ≈ 2 req/h
#   - cada 2 horas  → --backfill  (1 década que falte; no-op cuando ya están todas)
#   - diario 04:00  → default     (SOLO década actual + astronautas + eventos + Mars)
#   - manual        → cualquiera de los modos
#
# Un LL2_TOKEN (opcional, secreto del repo) sube a 1000 req/h; sin él va igual.

# OJO: cada schedule lleva un MINUTO ÚNICO. Cuando varios crons del mismo
# workflow coinciden en el mismo minuto (p. ej. '0 4' vs '*/30' en el :00),
# GitHub dispara UN solo run con el schedule del primero listado → el diario
# no corría NUNCA (astronauts/mars/events llevaban días sin regenerarse).
#
# Y NINGÚN cron en el minuto :00. GitHub encola los schedules y el :00 es el
# minuto más congestionado del día: durante julio de 2026 los runs de la franja
# 06:00-07:30 UTC se quedaban 15-40 min esperando y morían con "The job was not
# acquired by Runner of type hosted". No fallaba el script — no llegaba a
# ejecutarse. Por eso el frecuente va a :07 y :37.
on:
  schedule:
    - cron: '7,37 * * * *'   # frecuente: upcoming (:07 y :37, fuera del pico)
    - cron: '13 */2 * * *'   # cada 2 h (:13): backfill de una década (hasta completar)
    - cron: '43 3 * * *'     # diario (03:43): SOLO década actual + astronautas + eventos + Mars
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: 'backfill'
        type: choice
        options: [default, upcoming, backfill, full]

# Sin permisos por defecto: el job pide solo lo que necesita (escribir en el
# repo). Cualquier acción que se añada aquí en el futuro arranca sin nada.
permissions: {}

concurrency:
  group: mirror-sync
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Un sync completo tarda 1-2 min; el backfill de una década, menos de 10.
    # Sin este tope, un run que no consigue runner se queda ~40 min ocupando el
    # grupo de concurrencia (cancel-in-progress: false) y arrastra a los
    # siguientes a la cola.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Los valores de github.* se pasan por ENTORNO, nunca interpolados dentro
      # del script: interpolar mete el texto en el shell antes de ejecutarlo, y
      # eso es una inyección esperando a que algún campo deje de ser de fiar.
      - name: Build mirror
        env:
          LL2_TOKEN:  ${{ secrets.LL2_TOKEN }}
          LL2_BASE:   https://ll.thespacedevs.com/2.3.0
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          SCHEDULE:   ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_MODE" in
              default)  node scripts/build-mirror.js ;;
              upcoming) node scripts/build-mirror.js --upcoming ;;
              backfill) node scripts/build-mirror.js --backfill ;;
              full)     node scripts/build-mirror.js --full ;;
              *)        echo "Modo desconocido: $INPUT_MODE"; exit 1 ;;
            esac
          elif [ "$SCHEDULE" = "43 3 * * *" ]; then
            node scripts/build-mirror.js
          elif [ "$SCHEDULE" = "13 */2 * * *" ]; then
            node scripts/build-mirror.js --backfill
          else
            node scripts/build-mirror.js --upcoming
          fi

      # Calendario suscribible. No gasta ninguna llamada a LL2 —solo relee
      # upcoming.json— así que se regenera en todos los runs, incluido el tick
      # frecuente: quien esté suscrito ve las fechas nuevas casi al momento.
      - name: Build subscribable calendar
        run: node scripts/build-ics.js

      # Trazado de los eclipses solares. La geometría de un eclipse no cambia,
      # así que basta con el ciclo diario; el script conserva lo ya publicado
      # si la fuente de la NASA no responde.
      - name: Build eclipse paths
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 3 * * *'
        run: node scripts/build-eclipses.js

      # Redacta los briefings de misión con un modelo y los deja como JSON
      # estático. Sin ninguna clave el script avisa y sale sin error: la app cae
      # a sus plantillas locales, así que el mirror sigue siendo válido.
      # Solo en el diario y en los disparos manuales — el tick de 30 min no lo
      # necesita y no tiene sentido gastar llamadas ahí.
      - name: Generate briefings
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 3 * * *'
        env:
          # Se usa la clave que exista; sin ninguna, el paso no llama a nada.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_API_KEY:  ${{ secrets.BRIEFING_API_KEY }}
          BRIEFING_PROVIDER: ${{ vars.BRIEFING_PROVIDER }}
          BRIEFING_BASE:     ${{ vars.BRIEFING_BASE }}
          BRIEFING_MODEL:    ${{ vars.BRIEFING_MODEL }}
        run: node scripts/generate-briefings.js

      # Portero: si lo generado no se puede servir, este paso falla y el commit
      # nunca ocurre. La versión anterior sigue publicada, que es exactamente lo
      # que queremos: datos de hace un rato antes que una app en blanco.
      - name: Verify output
        run: node scripts/verify-mirror.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(mirror): sync LL2 data [skip ci]"

            # Si otro run coló un commit entre nuestro checkout y el push, hay
            # que rebasar. Todo lo que hay aquí es GENERADO, así que un choque
            # no se fusiona: gana nuestra copia, que es la más reciente. En un
            # rebase "theirs" son justamente nuestros commits.
            for attempt in 1 2 3; do
              if git push; then
                echo "Empujado al intento $attempt."
                exit 0
              fi
              echo "Push rechazado; rebasando sobre el remoto (intento $attempt)…"
              git rebase --abort 2>/dev/null || true
              git fetch origin "${GITHUB_REF_NAME}"
              if ! git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
                git rebase --abort 2>/dev/null || true
                echo "Rebase imposible. Se abandona ESTE sync sin fallar: los datos"
                echo "no se pierden, el siguiente run los regenera en minutos."
                exit 0
              fi
              sleep 5
            done
            echo "No se pudo empujar tras 3 intentos; el siguiente run lo recupera."
            exit 0
          fi
